name: document-questionnaire

services:
  web:
    build:
      context: ./web
    image: document-questionnaire-web:local
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "${AUTOFILL_WEB_BIND:-127.0.0.1}:${AUTOFILL_WEB_PORT:-8765}:8080"
    depends_on:
      server:
        condition: service_healthy
      processor:
        condition: service_healthy
    networks:
      private:
        ipv4_address: ${AUTOFILL_FRONTEND_IP:-10.89.0.2}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0750,size=16m
      - /var/cache/nginx:uid=101,gid=101,mode=0750,size=32m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    init: true

  server:
    build:
      context: ./server
    image: document-questionnaire-server:local
    command: ["python", "-m", "autofill.adapters.http.app"]
    environment:
      AUTOFILL_API_HOST: 0.0.0.0
      AUTOFILL_API_PORT: 8000
      AUTOFILL_PUBLIC_ORIGIN: ${AUTOFILL_PUBLIC_ORIGIN:-http://127.0.0.1:8765}
      AUTOFILL_TRUSTED_PROXY_CIDRS: ${AUTOFILL_FRONTEND_IP:-10.89.0.2}/32
      AUTOFILL_STATE_DIR: /var/lib/autofill/workflow/state
      AUTOFILL_PROCESS_QUEUE: /var/lib/autofill/workflow/processor-jobs
      AUTOFILL_RESULTS_DIR: /var/lib/autofill/results
      AUTOFILL_KEY_FILE: /var/lib/autofill/secrets/master.key
    volumes:
      - ./var/workflow:/var/lib/autofill/workflow
      - ./var/secrets:/var/lib/autofill/secrets
      - ./var/results:/var/lib/autofill/results
    networks:
      private:
        ipv4_address: ${AUTOFILL_BACKEND_IP:-10.89.0.3}
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    init: true

  processor:
    build:
      context: ./deploy/processor
      additional_contexts:
        server: ./server
    image: document-questionnaire-processor:local
    command: ["python", "-m", "autofill.adapters.processor.processor"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      AUTOFILL_PROCESS_QUEUE: /work
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./var/workflow/processor-jobs:/work
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=256m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,time; p=pathlib.Path('/work/heartbeat'); assert p.is_file() and time.time()-p.stat().st_mtime < 60"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    init: true

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: ${AUTOFILL_PRIVATE_SUBNET:-10.89.0.0/24}
