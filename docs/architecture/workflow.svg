<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="124" viewBox="0 0 1080 124" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">DocFlow 七节点工作流程</title>
  <desc id="workflow-desc">LLM 参与理解和作答；自主作答的文字答案超出版式时，LLM 在写入阶段压缩。Jev 可选参与自主作答的选项题决策。</desc>
