      <text x="396" y="42" fill="#345B46" font-size="15" font-weight="600">03 · 理解</text>
      <rect x="376" y="51" width="40" height="17" rx="8.5" fill="#E7EEFF" />
      <text x="396" y="63" fill="#526FC0" font-size="10" font-weight="700">LLM</text>
    </g>
    <g>
      <rect x="480" y="16" width="120" height="64" rx="12" fill="#FFF7E8" stroke="#E3C98F" stroke-width="1.4" />
