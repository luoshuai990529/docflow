      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8CA592" />
    </marker>
  </defs>
  <g fill="none" stroke="#8CA592" stroke-width="2" marker-end="url(#arrow)">
    <path d="M168 48 H192" />
    <path d="M312 48 H336" />
    <path d="M456 48 H480" />
    <path d="M600 48 H624" />
    <path d="M744 48 H768" />
    <path d="M888 48 H912" />
  </g>
