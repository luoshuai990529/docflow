  <text x="48" y="109" fill="#66756B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">LLM = DeepSeek · * 自主文字答案超出版式时在写入阶段压缩 · Jev* 自主选项决策（仅自主作答，可选）</text>
