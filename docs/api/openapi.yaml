      operationId: upload_api_v1_uploads_put
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 240
          title: Name
      - name: role
        in: query
        required: true
        schema:
          enum:
          - questionnaire
          - source
          type: string
          title: Role
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          title: X-Csrf-Token
