components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        diagnostics:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Diagnostics
      type: object
      required:
      - code
      - message
      title: ApiError
    ApiErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      type: object
      required:
      - error
      title: ApiErrorEnvelope
    CancelAccepted:
      properties:
        accepted:
          type: boolean
          title: Accepted
      type: object
      required:
      - accepted
      title: CancelAccepted
    ConfigList:
      properties:
        configs:
          items:
            $ref: '#/components/schemas/ConfigMetadata'
          type: array
          title: Configs
        configured:
          type: boolean
          title: Configured
      type: object
      required:
      - configs
      - configured
      title: ConfigList
    ConfigMetadata:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        provider:
          type: string
          title: Provider
        model:
          type: string
          title: Model
        base_url:
          type: string
          title: Base Url
        output_mode:
          type: string
          title: Output Mode
        protocol:
          type: string
          title: Protocol
        has_key:
          type: boolean
          title: Has Key
        key_mask:
          type: string
          title: Key Mask
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - name
      - provider
      - model
      - base_url
      - output_mode
      - protocol
      - has_key
      - key_mask
      - updated_at
      title: ConfigMetadata
    ConfigResult:
      properties:
        config:
          $ref: '#/components/schemas/ConfigMetadata'
      type: object
      required:
      - config
      title: ConfigResult
    ConfigWrite:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        provider:
          type: string
          maxLength: 80
          minLength: 1
          title: Provider
        model:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Model
        base_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Base Url
        output_mode:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Output Mode
        protocol:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Protocol
        api_key:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Api Key
        clear_key:
          type: boolean
          title: Clear Key
          default: false
      additionalProperties: false
      type: object
      required:
      - name
      - provider
      title: ConfigWrite
    DeleteResult:
      properties:
        deleted:
          type: boolean
          title: Deleted
      type: object
      required:
      - deleted
      title: DeleteResult
    JobAccepted:
      properties:
        id:
          type: string
          title: Id
      type: object
      required:
      - id
      title: JobAccepted
    JobList:
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/JobView'
          type: array
          title: Jobs
      type: object
      required:
      - jobs
      title: JobList
    JobSubmit:
      properties:
        request_id:
          type: string
          maxLength: 80
          minLength: 16
          pattern: ^[A-Za-z0-9_-]+$
          title: Request Id
        config_id:
          type: string
          maxLength: 80
          minLength: 1
          title: Config Id
        questionnaire:
          type: string
          pattern: ^[a-f0-9]{32}$
          title: Questionnaire
        sources:
          items:
            type: string
          type: array
          maxItems: 20
          title: Sources
        answer_mode:
          type: string
          enum:
          - grounded
          - autonomous
          title: Answer Mode
          default: grounded
        decision_config_id:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Decision Config Id
      additionalProperties: false
      type: object
      required:
      - request_id
      - config_id
      - questionnaire
      - sources
      title: JobSubmit
    JobView:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          title: Status
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        finished_at:
          anyOf:
